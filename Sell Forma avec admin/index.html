<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormationPro - Nos Formations</title>
    
    <!-- Google Fonts: Inter (police pro) & Fira Code (police hacker) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <header class="header">
        <a href="index.html" class="logo">FormationPro</a>
        <nav class="nav-links">
            <ul>
                <li><a href="index.html" class="active"><i class="fas fa-home"></i> Accueil</a></li>
                <li><a href="notification.html"><i class="fas fa-bell"></i> Notifications <span id="notif-count" class="notif-count" style="display: none;">0</span></a></li>
                <li><a href="formationbuy.html"><i class="fas fa-graduation-cap"></i> Mes Formations</a></li>
                <li>
                    <a href="panier.html" class="cart-link">
                        <i class="fas fa-shopping-cart"></i> Panier
                        <span id="cart-item-count" class="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </nav>
        <div class="header-user-info">
             <div class="user-id-container">
                <span id="user-id-display"></span>
                <button id="copy-user-id-btn" title="Copier mon ID client"><i class="fas fa-copy"></i></button>
            </div>
            <button id="theme-switcher" class="theme-switcher" title="Changer de thème">
                <!-- L'icône sera gérée par JS pour refléter le thème actuel -->
                <i class="fas fa-adjust"></i>
            </button>
        </div>
    </header>

    <main class="container">
        <!-- ==================== FILTRES ET RECHERCHE (Nouveau design) ==================== -->
        <section class="filters-section">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Rechercher une formation...">
            </div>
            <div class="filters">
                <div class="filter-group price-filter">
                    <label>Prix :</label>
                    <input type="number" id="min-price" placeholder="Min" min="0">
                    <span>-</span>
                    <input type="number" id="max-price" placeholder="Max" min="0">
                </div>
                <div class="filter-group category-filter">
                    <label>Catégories :</label>
                    <div id="category-filters" class="category-buttons">
                        <!-- Les boutons de catégorie seront générés par JS -->
                    </div>
                </div>
                 <button id="reset-filters-btn" class="btn btn-secondary">Réinitialiser</button>
            </div>
        </section>

        <!-- ==================== GRILLE DE PRODUITS ==================== -->
        <section id="product-grid" class="product-grid">
            <!-- Les cartes de produits seront injectées ici par JavaScript -->
        </section>

        <!-- ==================== PAGINATION ==================== -->
        <nav id="pagination-controls" class="pagination-controls" aria-label="Pagination des produits">
            <!-- Les contrôles de pagination seront injectés ici -->
        </nav>
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-column">
                <h3>Aide & Support</h3>
                <a href="tutoriel.html">Tutoriel d'utilisation</a>
                <a href="https://wa.me/2250595762779" target="_blank">Service Client (WhatsApp)</a>
            </div>
            <div class="footer-column">
                <h3>Parrainage</h3>
                <p>Invitez des amis et gagnez des bonus !</p>
                <div class="referral-container">
                    <input type="text" id="referral-link-input" readonly>
                    <button id="copy-referral-link-btn" class="btn btn-primary">Copier</button>
                </div>
                 <a href="parrainage.html">Voir mes gains</a>
            </div>
            <div class="footer-column">
                <h3>Mes Données</h3>
                <button id="export-btn" class="btn btn-secondary">Exporter mes données</button>
                <label for="import-file" class="btn btn-secondary">Importer mes données</label>
                <input type="file" id="import-file" accept=".json" style="display: none;">
            </div>
        </div>
        <div class="footer-bottom">
            <p>© 2024 FormationPro. Tous droits réservés.</p>
        </div>
    </footer>

    <!-- ==================== UTILITAIRES ==================== -->
    <a href="#" id="scroll-to-top" class="scroll-to-top" title="Remonter en haut">
        <i class="fas fa-arrow-up"></i>
    </a>
    <div id="alert-container"></div>

    <!-- ==================== SCRIPTS JS ==================== -->
    <script src="js/helpers.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
