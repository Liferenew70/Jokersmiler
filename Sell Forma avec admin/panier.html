    <main class="container">

    <a href="#" id="scroll-to-top" class="scroll-to-top"><i class="fas fa-arrow-up"></i></a>
    <div id="alert-container"></div>

    <script src="js/helpers.js"></script>
    <script src="js/app.js"></script>

    <!-- SCRIPT SPÉCIFIQUE À LA PAGE PANIER -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cartContent = document.getElementById('cart-content');

            // Fonction principale qui redessine toute la page du panier
            function renderCartPage() {
                const cartDetails = getCartDetailsWithPromo();

                if (cartDetails.items.length === 0) {
                    cartContent.innerHTML = `<div class="empty-cart-message"><h2>Votre panier est vide.</h2><p>Parcourez nos formations pour trouver votre bonheur !</p><a href="index.html" class="btn btn-primary">Voir les produits</a></div>`;
                    return;
                }

                const itemsHTML = cartDetails.items.map(item => `
                    <div class="cart-item" data-id="${item.id}">
                        <div class="cart-item-select"><input type="checkbox" class="item-select-checkbox" data-action="toggle-select" data-id="${item.id}" ${item.selected ? 'checked' : ''}></div>
                        <img src="${item.image}" alt="${item.title}" class="cart-item-image">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${item.title}</div>
                            <div class="cart-item-price">${formatPrice(item.prixPromo)}</div>
                            ${item.fees > 0 ? `<div class="cart-item-fees">Frais : ${formatPrice(item.fees)}</div>` : ''}
                        </div>
                        <div class="cart-item-actions">
                            <div class="quantity-control">
                                <button class="quantity-btn" data-action="decrease-qty" data-id="${item.id}">-</button>
                                <span class="item-quantity">${item.quantity}</span>
                                <button class="quantity-btn" data-action="increase-qty" data-id="${item.id}">+</button>
                            </div>
                            <button class="remove-item-btn" data-action="remove-item" data-id="${item.id}"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>`).join('');
                
                const summaryHTML = `
                    <div class="order-summary">
                        <h3>Récapitulatif</h3>
                        <div class="summary-line"><span>Sous-total</span><span>${formatPrice(cartDetails.subtotal)}</span></div>
                        <div class="summary-line"><span>Frais</span><span>${formatPrice(cartDetails.totalFees)}</span></div>
                        ${cartDetails.discount > 0 ? `<div class="summary-line discount-line"><span>${cartDetails.promoMessage}</span><span>-${formatPrice(cartDetails.discount)}</span></div>` : ''}
                        <div class="summary-line total"><span>TOTAL</span><span>${formatPrice(cartDetails.grandTotal)}</span></div>
                        <div class="payment-buttons">
                           <button class="btn btn-primary" data-action="pay" ${cartDetails.selectedItemCount === 0 ? 'disabled' : ''}><i class="fas fa-shield-alt"></i> Procéder au paiement</button>
                        </div>
                    </div>
                    <div class="promo-section">
                        <h3>Code Promo</h3>
                        <div class="promo-code-input-group">
                            <input type="text" id="promo-code-input" placeholder="Entrez votre code" value="${localStorage.getItem('appliedPromoCode') || ''}">
                            <button class="btn btn-secondary" data-action="apply-promo">Appliquer</button>
                        </div>
                    </div>
                `;

                cartContent.innerHTML = `
                    <div class="cart-page-layout">
                        <div class="order-summary-section">${summaryHTML}</div>
                        <div class="cart-items-section">
                            <div id="cart-items-container" class="cart-items-container">${itemsHTML}</div>
                            <div class="cart-actions-footer"><button class="btn btn-danger" data-action="empty-cart">Vider le panier</button></div>
                        </div>
                    </div>`;
            }

            // GESTIONNAIRE D'ÉVÉNEMENTS PRINCIPAL CORRIGÉ
            cartContent.addEventListener('click', async (e) => {
                const target = e.target;
                const actionTarget = target.closest('[data-action]');
                
                if (!actionTarget) return;

                const action = actionTarget.dataset.action;
                const productId = actionTarget.dataset.id;
                
                e.stopPropagation();

                switch (action) {
                    case 'increase-qty': {
                        const item = getCart().find(i => i.id === productId);
                        updateQuantity(productId, item.quantity + 1);
                        renderCartPage();
                        break;
                    }
                    case 'decrease-qty': {
                        const item = getCart().find(i => i.id === productId);
                        if (item.quantity > 1) {
                            updateQuantity(productId, item.quantity - 1);
                            renderCartPage();
                        } else {
                            const confirmed = await showConfirmation('Supprimer le produit ?', 'La quantité est à 1. Voulez-vous le retirer du panier ?');
                            if (confirmed) {
                                removeFromCart(productId);
                                renderCartPage();
                            }
                        }
                        break;
                    }
                    case 'remove-item': {
                        const confirmed = await showConfirmation('Supprimer le produit ?', `Voulez-vous vraiment retirer "${PRODUCTS[productId].title}" ?`);
                        if (confirmed) {
                            removeFromCart(productId);
                            renderCartPage();
                        }
                        break;
                    }
                    case 'toggle-select': {
                        toggleItemSelected(productId, target.checked);
                        renderCartPage();
                        break;
                    }
                    case 'empty-cart': {
                        const confirmed = await showConfirmation('Vider le panier ?', 'Cette action supprimera tous les articles de votre panier.');
                        if (confirmed) {
                            emptyCart();
                            renderCartPage();
                        }
                        break;
                    }
                    case 'apply-promo': {
                        const input = document.getElementById('promo-code-input');
                        const code = input.value.trim().toUpperCase();
                        if (!code) {
                            localStorage.removeItem('appliedPromoCode');
                            showAlert('Champ de code promo vidé.', 'info');
                        } else {
                            if (PROMO_CODES[code]) {
                                localStorage.setItem('appliedPromoCode', code);
                                const details = getCartDetailsWithPromo();
                                if (details.discount > 0) {
                                    showAlert('Code promo appliqué avec succès !', 'success');
                                } else {
                                    showAlert('Ce code n\'est pas valide pour votre panier actuel.', 'danger');
                                    localStorage.removeItem('appliedPromoCode');
                                }
                            } else {
                                showAlert('Code promo invalide.', 'danger');
                                localStorage.removeItem('appliedPromoCode');
                            }
                        }
                        renderCartPage();
                        break;
                    }
                    case 'pay': {
                        window.location.href = 'formlivraison.html';
                        break;
                    }
                }
            });

            // FONCTION DE CALCUL DU PANIER AVEC GESTION DES PROMOS (INCHANGÉE)
            function getCartDetailsWithPromo() {
                const cart = getCart();
                const appliedPromoCode = localStorage.getItem('appliedPromoCode');
                const details = { items: [], subtotal: 0, totalFees: 0, discount: 0, promoMessage: null, grandTotal: 0, selectedItemCount: 0 };
                
                details.items = cart.map(item => ({ ...PRODUCTS[item.id], ...item }));
                const selectedItems = details.items.filter(item => item.selected);
                details.selectedItemCount = selectedItems.length;

                for (const item of selectedItems) {
                    details.subtotal += item.prixPromo * item.quantity;
                    details.totalFees += (item.fees || 0) * item.quantity;
                }

                if (appliedPromoCode && PROMO_CODES[appliedPromoCode]) {
                    const promo = PROMO_CODES[appliedPromoCode];
                    let isValid = true;
                    if (promo.conditions.minItems && selectedItems.length < promo.conditions.minItems) { isValid = false; }
                    if (promo.conditions.onlyOnDay === "monday" && new Date().getDay() !== 1) { isValid = false; }
                    if (promo.conditions.onlyOnDay === "firstOfMonth" && new Date().getDate() !== 1) { isValid = false; }
                    
                    if (isValid) {
                        details.promoMessage = promo.type === 'percent' ? `Réduction (${promo.value}%)` : 'Réduction';
                        details.discount = promo.type === 'percent' ? (details.subtotal * promo.value) / 100 : promo.value;
                    } else {
                        localStorage.removeItem('appliedPromoCode');
                    }
                }

                details.grandTotal = details.subtotal + details.totalFees - details.discount;
                details.grandTotal = details.grandTotal < 0 ? 0 : details.grandTotal;
                
                return details;
            }
            
            // Premier rendu
            renderCartPage();
        });
    </script>
</body>
</html>
