<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormationPro - Tutoriels</title>

    <!-- Google Fonts: Inter (police pro) & Fira Code (police hacker) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">FormationPro</a>
        <nav class="nav-links">
            <ul>
                <li><a href="index.html"><i class="fas fa-home"></i> Accueil</a></li>
                <li><a href="notification.html"><i class="fas fa-bell"></i> Notifications <span id="notif-count" class="notif-count" style="display: none;">0</span></a></li>
                <li><a href="formationbuy.html"><i class="fas fa-graduation-cap"></i> Mes Formations</a></li>
                <li>
                    <a href="panier.html" class="cart-link">
                        <i class="fas fa-shopping-cart"></i> Panier
                        <span id="cart-item-count" class="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </nav>
        <div class="header-user-info">
             <div class="user-id-container">
                <span id="user-id-display"></span>
                <button id="copy-user-id-btn" title="Copier mon ID client"><i class="fas fa-copy"></i></button>
            </div>
            <button id="theme-switcher" class="theme-switcher" title="Changer de thème">
                <i class="fas fa-adjust"></i>
            </button>
        </div>
    </header>

    <main class="container">
        <div class="tutorial-page-header">
            <h1><i class="fas fa-question-circle"></i> Centre d'Aide Vidéo</h1>
            <p>Apprenez à utiliser toutes les fonctionnalités du site grâce à ces courtes vidéos.</p>
        </div>

        <div class="tutorial-layout">
            <div class="video-player-area">
                <div class="video-container">
                    <video id="main-video" poster="https://i.ytimg.com/vi/aqz-KE-bpKQ/maxresdefault.jpg">
                        <!-- La source sera définie par JS -->
                    </video>
                    <div class="video-controls">
                        <div class="progress-bar-container" id="progress-bar">
                            <div class="progress-bar-fill"></div>
                        </div>
                        <div class="bottom-controls">
                            <div class="left-controls">
                                <button id="play-pause-btn" title="Lecture/Pause (k)"><i class="fas fa-play"></i></button>
                                <div class="volume-container">
                                    <button id="mute-btn" title="Muet (m)"><i class="fas fa-volume-up"></i></button>
                                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1" class="volume-slider">
                                </div>
                                <div class="time-display"><span id="current-time">0:00</span> / <span id="duration">0:00</span></div>
                            </div>
                            <div class="right-controls">
                                <button id="speed-btn" title="Vitesse de lecture">1x</button>
                                <button id="fullscreen-btn" title="Plein écran (f)"><i class="fas fa-expand"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="video-info-box">
                    <h2 id="video-title">Titre de la vidéo</h2>
                    <p id="video-description">Description de la vidéo...</p>
                </div>
            </div>

            <aside class="video-playlist" id="video-playlist">
                <h4>Liste de lecture</h4>
                <div id="playlist-items-container">
                    <!-- Les vidéos de la playlist seront injectées ici -->
                </div>
            </aside>
        </div>
    </main>

    <footer class="footer">
        <!-- Contenu du footer identique aux autres pages -->
    </footer>

    <a href="#" id="scroll-to-top" class="scroll-to-top"><i class="fas fa-arrow-up"></i></a>
    <div id="alert-container"></div>

    <script src="js/helpers.js"></script>
    <script src="js/app.js"></script>
    
    <!-- SCRIPT COMPLET ET AUTONOME POUR LE LECTEUR VIDÉO -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const playlist = [
                { 
                    title: 'Naviguer et Chercher un Produit', 
                    description: 'Découvrez comment utiliser la barre de recherche et les filtres pour trouver la formation parfaite pour vous.',
                    src: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', 
                    thumb: 'https://peach.blender.org/wp-content/uploads/title_anouncement.jpg?x11217',
                    duration: '09:56'
                },
                { 
                    title: 'Utiliser le Panier et les Codes Promo', 
                    description: 'Apprenez à ajouter des produits, à gérer les quantités et à appliquer un code de réduction pour économiser sur vos achats.',
                    src: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', 
                    thumb: 'https://orange.blender.org/wp-content/themes/orange/images/media/gallery/01_lite.jpg',
                    duration: '10:53'
                },
                { 
                    title: 'Gérer sa Bibliothèque de Formations', 
                    description: 'Voyez comment accéder à vos formations achetées, et comment exporter ou importer votre bibliothèque pour la synchroniser entre appareils.',
                    src: 'http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', 
                    thumb: 'https://i.ytimg.com/vi/aqz-KE-bpKQ/maxresdefault.jpg',
                    duration: '00:15'
                }
                // Ajoutez d'autres vidéos ici
            ];

            // Éléments du DOM
            const video = document.getElementById('main-video');
            const videoTitleEl = document.getElementById('video-title');
            const videoDescriptionEl = document.getElementById('video-description');
            const playlistContainer = document.getElementById('playlist-items-container');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const muteBtn = document.getElementById('mute-btn');
            const volumeSlider = document.getElementById('volume-slider');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const durationEl = document.getElementById('duration');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const speedBtn = document.getElementById('speed-btn');
            const videoContainer = document.querySelector('.video-container');

            // --- GESTION DE LA PLAYLIST ---
            function loadPlaylist() {
                playlistContainer.innerHTML = ''; // Vider la liste
                playlist.forEach((videoData, index) => {
                    const item = document.createElement('div');
                    item.className = 'playlist-item';
                    item.dataset.index = index;
                    item.innerHTML = `
                        <img src="${videoData.thumb}" alt="${videoData.title}" class="playlist-thumb">
                        <div class="playlist-details">
                            <h5>${videoData.title}</h5>
                            <span><i class="fas fa-clock"></i> ${videoData.duration}</span>
                        </div>
                        <div class="playlist-play-icon"><i class="fas fa-play"></i></div>
                    `;
                    item.addEventListener('click', () => {
                        loadVideo(index);
                        video.play();
                    });
                    playlistContainer.appendChild(item);
                });
            }

            function loadVideo(index) {
                const videoData = playlist[index];
                video.src = videoData.src;
                video.poster = videoData.thumb;
                videoTitleEl.textContent = videoData.title;
                videoDescriptionEl.textContent = videoData.description;

                document.querySelectorAll('.playlist-item').forEach(item => {
                    item.classList.toggle('active', item.dataset.index == index);
                });
            }

            // --- CONTRÔLES DU LECTEUR ---
            const togglePlay = () => video.paused ? video.play() : video.pause();
            const updatePlayIcon = () => playPauseBtn.innerHTML = `<i class="fas ${video.paused ? 'fa-play' : 'fa-pause'}"></i>`;
            
            const formatTime = (time) => {
                const minutes = Math.floor(time / 60);
                const seconds = Math.floor(time % 60);
                return `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }

            const handleTimeUpdate = () => {
                const progress = (video.currentTime / video.duration) * 100;
                progressBar.querySelector('.progress-bar-fill').style.width = `${progress}%`;
                currentTimeEl.textContent = formatTime(video.currentTime);
            }
            
            const scrub = (e) => {
                const rect = progressBar.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const scrubTime = (clickX / progressBar.offsetWidth) * video.duration;
                video.currentTime = scrubTime;
            }

            const toggleMute = () => video.muted = !video.muted;
            
            const updateVolumeIcon = () => {
                let iconClass = 'fa-volume-up';
                if (video.muted || video.volume === 0) iconClass = 'fa-volume-mute';
                else if (video.volume < 0.5) iconClass = 'fa-volume-down';
                muteBtn.innerHTML = `<i class="fas ${iconClass}"></i>`;
            }
            
            const playbackSpeeds = [0.5, 0.75, 1, 1.5, 2];
            let currentSpeedIndex = 2; // Index pour 1x

            const cycleSpeed = () => {
                currentSpeedIndex = (currentSpeedIndex + 1) % playbackSpeeds.length;
                video.playbackRate = playbackSpeeds[currentSpeedIndex];
                speedBtn.textContent = `${video.playbackRate}x`;
            }

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    videoContainer.requestFullscreen().catch(err => alert(`Erreur plein écran: ${err.message}`));
                } else {
                    document.exitFullscreen();
                }
            }
            const updateFullscreenIcon = () => fullscreenBtn.innerHTML = `<i class="fas ${document.fullscreenElement ? 'fa-compress' : 'fa-expand'}"></i>`;

            // --- ÉVÉNEMENTS ---
            playPauseBtn.addEventListener('click', togglePlay);
            video.addEventListener('click', togglePlay);
            video.addEventListener('play', updatePlayIcon);
            video.addEventListener('pause', updatePlayIcon);
            video.addEventListener('timeupdate', handleTimeUpdate);
            video.addEventListener('loadedmetadata', () => durationEl.textContent = formatTime(video.duration));
            
            progressBar.addEventListener('click', scrub);
            muteBtn.addEventListener('click', toggleMute);
            speedBtn.addEventListener('click', cycleSpeed);
            volumeSlider.addEventListener('input', (e) => video.volume = e.target.value);
            video.addEventListener('volumechange', updateVolumeIcon);
            
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            document.addEventListener('fullscreenchange', updateFullscreenIcon);

            // Raccourcis clavier
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return; // Ne pas activer si on tape dans un champ
                switch(e.key.toLowerCase()) {
                    case 'k': case ' ': e.preventDefault(); togglePlay(); break;
                    case 'm': toggleMute(); break;
                    case 'f': toggleFullscreen(); break;
                    case 'arrowright': video.currentTime += 5; break;
                    case 'arrowleft': video.currentTime -= 5; break;
                }
            });

            // Initialisation
            loadPlaylist();
            loadVideo(0); // Charger la première vidéo par défaut
        });
    </script>
</body>
</html>
