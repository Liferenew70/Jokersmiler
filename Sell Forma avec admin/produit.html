<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormationPro - Détails du produit</title>
    
    <!-- Google Fonts: Inter (police pro) & Fira Code (police hacker) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">FormationPro</a>
        <nav class="nav-links">
            <ul>
                <li><a href="index.html"><i class="fas fa-home"></i> Accueil</a></li>
                <li><a href="notification.html"><i class="fas fa-bell"></i> Notifications <span id="notif-count" class="notif-count" style="display: none;">0</span></a></li>
                <li><a href="formationbuy.html"><i class="fas fa-graduation-cap"></i> Mes Formations</a></li>
                <li>
                    <a href="panier.html" class="cart-link">
                        <i class="fas fa-shopping-cart"></i> Panier
                        <span id="cart-item-count" class="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </nav>
        <div class="header-user-info">
             <div class="user-id-container">
                <span id="user-id-display"></span>
                <button id="copy-user-id-btn" title="Copier mon ID client"><i class="fas fa-copy"></i></button>
            </div>
            <button id="theme-switcher" class="theme-switcher" title="Changer de thème">
                <i class="fas fa-adjust"></i>
            </button>
        </div>
    </header>

    <main class="container">
        <!-- Lien de retour intelligent -->
        <a href="#" id="back-to-products-link" class="back-link"><i class="fas fa-arrow-left"></i> Retour</a>

        <!-- Conteneur principal qui sera rempli par JS -->
        <div id="product-detail-content">
            <!-- Message de chargement -->
            <div class="loading-placeholder">
                <div class="spinner"></div>
                <p>Chargement du produit...</p>
            </div>
        </div>

        <!-- Section des produits recommandés -->
        <section id="related-products-section" class="related-products-section" style="display: none;">
            <h2>Vous pourriez aussi aimer</h2>
            <div id="related-products-grid" class="product-grid">
                <!-- Les produits recommandés seront injectés ici -->
            </div>
        </section>

    </main>
    
    <footer class="footer">
        <!-- Contenu du footer identique aux autres pages -->
    </footer>

    <!-- Utilitaires -->
    <a href="#" id="scroll-to-top" class="scroll-to-top" title="Remonter en haut"><i class="fas fa-arrow-up"></i></a>
    <div id="alert-container"></div>

    <!-- SCRIPTS JS -->
    <script src="js/helpers.js"></script>
    <script src="js/app.js"></script>

    <!-- SCRIPT AMÉLIORÉ POUR LA PAGE PRODUIT -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const productDetailContainer = document.getElementById('product-detail-content');
            const relatedSection = document.getElementById('related-products-section');
            const relatedGrid = document.getElementById('related-products-grid');
            const backLink = document.getElementById('back-to-products-link');

            // --- FONCTION DE MÉLANGE (Fisher-Yates Shuffle) ---
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            // --- FONCTION DE RECHERCHE DE PRODUITS SIMILAIRES ---
            function findRelatedProducts(currentProductId, count) {
                const currentProduct = PRODUCTS[currentProductId];
                if (!currentProduct || !currentProduct.categories) return [];

                const allProducts = Object.values(PRODUCTS);
                
                // 1. Filtrer les produits ayant au moins une catégorie en commun
                let related = allProducts.filter(p => 
                    p.id !== currentProductId &&
                    p.categories.some(cat => currentProduct.categories.includes(cat))
                );

                // 2. Mélanger les résultats
                related = shuffleArray(related);
                
                // 3. Renvoyer le nombre souhaité
                return related.slice(0, count);
            }
            
            // --- FONCTION PRINCIPALE ---
            function renderPage() {
                const urlParams = new URLSearchParams(window.location.search);
                const productId = urlParams.get('id');
                const product = PRODUCTS[productId];

                if (product) {
                    document.title = `FormationPro - ${product.title}`;

                    productDetailContainer.innerHTML = `
                        <div class="product-detail-layout">
                            <div class="product-image-column">
                                <img src="${product.image}" alt="${product.title}">
                            </div>
                            <div class="product-details-column">
                                <div class="product-categories-tags">
                                    ${product.categories.map(cat => `<span>${cat.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase())}</span>`).join('')}
                                </div>
                                <h1 class="product-main-title">${product.title}</h1>
                                <div class="product-meta-info">
                                    <span class="meta-item" title="Instructeur"><i class="fas fa-chalkboard-teacher"></i> ${product.instructor || 'Expert'}</span>
                                    <span class="meta-item" title="Niveau requis"><i class="fas fa-layer-group"></i> ${product.level || 'Tous niveaux'}</span>
                                    <span class="meta-item" title="Durée"><i class="fas fa-clock"></i> ${product.duration || 'N/A'}</span>
                                </div>
                                <div class="product-pricing">
                                    <span class="price-promo">${formatPrice(product.prixPromo)}</span>
                                    <span class="price-original">${formatPrice(product.price)}</span>
                                </div>
                                <div class="product-page-actions">
                                    <button class="btn btn-primary btn-lg" id="add-to-cart-btn"><i class="fas fa-cart-plus"></i> Ajouter au panier</button>
                                </div>
                                <div class="product-full-description">
                                    ${product.fullDescription}
                                    <a href="#" id="whatsapp-pay-link">Ou payer directement via WhatsApp</a>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    // Gestion des produits recommandés
                    const relatedProducts = findRelatedProducts(productId, 4);
                    if (relatedProducts.length > 0) {
                        relatedGrid.innerHTML = relatedProducts.map(related => {
                            // On réutilise la nouvelle carte produit pro (style Spotify)
                            return `
                                <div class="product-card" onclick="window.location.href='produit.html?id=${related.id}'">
                                    <div class="product-image-container">
                                        <img src="${related.image}" alt="${related.title}" class="product-image">
                                        <button class="play-button"><i class="fas fa-play"></i></button>
                                    </div>
                                    <div class="product-info">
                                        <h3 class="product-title">${related.title}</h3>
                                        <p class="product-description-mince">${formatPrice(related.prixPromo)}</p>
                                    </div>
                                </div>
                            `;
                        }).join('');
                        relatedSection.style.display = 'block';
                    }

                    // Attacher les écouteurs d'événements
                    document.getElementById('add-to-cart-btn').addEventListener('click', () => addToCart(product.id));
                    document.getElementById('whatsapp-pay-link').addEventListener('click', (e) => {
                        e.preventDefault();
                        const message = `Bonjour, je suis intéressé par votre formation "${product.title}" au prix de ${formatPrice(product.prixPromo)}.`;
                        showConfirmation('Redirection vers WhatsApp', message, { confirmText: 'Continuer', confirmClass: 'btn-success' }).then(confirmed => {
                            if (confirmed) window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
                        });
                    });

                } else {
                    productDetailContainer.innerHTML = '<h1>Produit non trouvé</h1><p>Le produit que vous cherchez n\'existe pas ou n\'est plus disponible.</p>';
                }
            }

            backLink.addEventListener('click', (e) => {
                e.preventDefault();
                // Si l'utilisateur vient d'une autre page du site, on revient en arrière. Sinon, on va à l'accueil.
                if (document.referrer && document.referrer.startsWith(window.location.origin)) {
                    history.back();
                } else {
                    window.location.href = 'index.html';
                }
            });

            renderPage();
        });
    </script>
</body>
</html>
