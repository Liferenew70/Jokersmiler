    <!-- SCRIPT AMÉLIORÉ POUR LA PAGE NOTIFICATIONS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const listContainer = document.getElementById('notification-list');
            const deleteAllBtn = document.getElementById('delete-all-btn');
            const userId = getOrGenerateUserId();

            function getNotifications() {
                const allNotifications = JSON.parse(localStorage.getItem('userNotifications')) || {};
                return allNotifications[userId] || [];
            }

            function saveNotifications(notifications) {
                let allNotifications = JSON.parse(localStorage.getItem('userNotifications')) || {};
                allNotifications[userId] = notifications;
                localStorage.setItem('userNotifications', JSON.stringify(allNotifications));
            }

            function renderNotifications() {
                const userNotifications = getNotifications();
                
                if (userNotifications.length === 0) {
                    listContainer.innerHTML = `<div class="no-notifications-message"><h3>C'est calme ici...</h3><p>Vos notifications importantes apparaîtront sur cette page.</p></div>`;
                    deleteAllBtn.style.display = 'none';
                    return;
                }

                deleteAllBtn.style.display = 'inline-block';
                listContainer.innerHTML = ''; 
                userNotifications.forEach(notif => {
                    const date = new Date(notif.date).toLocaleString('fr-FR', { dateStyle: 'long', timeStyle: 'short' });
                    const iconClass = { success: 'fa-check-circle', danger: 'fa-times-circle', info: 'fa-info-circle' }[notif.type] || 'fa-bell';
                    
                    const notifHTML = `
                        <li class="notification-item ${notif.type} ${notif.read ? '' : 'unread'}" data-id="${notif.id}">
                            <div class="notification-icon"><i class="fas ${iconClass}"></i></div>
                            <div class="notification-content">
                                <p>${notif.message}</p>
                                <div class="notification-date">${date}</div>
                            </div>
                            <!-- Bouton de suppression individuelle -->
                            <button class="notification-delete-btn" data-action="delete" title="Supprimer cette notification">
                                <i class="fas fa-times"></i>
                            </button>
                        </li>
                    `;
                    listContainer.insertAdjacentHTML('beforeend', notifHTML);
                });
            }

            function markAllAsRead() {
                let userNotifications = getNotifications();
                userNotifications.forEach(notif => notif.read = true);
                saveNotifications(userNotifications);
                updateNotificationBadge(); 
            }

            // GESTION DES CLICS (Suppression individuelle ou globale)
            document.body.addEventListener('click', async (e) => {
                const deleteAllButton = e.target.closest('#delete-all-btn');
                const deleteIndividualButton = e.target.closest('.notification-delete-btn');

                if (deleteAllButton) {
                    const confirmed = await showConfirmation(
                        'Tout supprimer ?', 
                        'Voulez-vous vraiment supprimer TOUTES vos notifications ? Cette action est irréversible.',
                        { confirmText: 'Oui, tout supprimer', confirmClass: 'btn-danger' }
                    );
                    if (confirmed) {
                        saveNotifications([]);
                        renderNotifications();
                        showAlert('Toutes les notifications ont été supprimées.', 'info');
                    }
                }

                if (deleteIndividualButton) {
                    const notifItem = deleteIndividualButton.closest('.notification-item');
                    const notifId = notifItem.dataset.id;
                    
                    // Animation de suppression
                    notifItem.style.transition = 'opacity 0.3s, transform 0.3s';
                    notifItem.style.opacity = '0';
                    notifItem.style.transform = 'translateX(50px)';
                    
                    setTimeout(() => {
                        let userNotifications = getNotifications();
                        const updatedNotifications = userNotifications.filter(n => n.id !== notifId);
                        saveNotifications(updatedNotifications);
                        renderNotifications(); // Redessine la liste sans l'élément
                        showAlert('Notification supprimée.', 'success');
                    }, 300);
                }
            });

            // Rendu initial et marquage des notifications comme lues
            renderNotifications();
            markAllAsRead();
        });
    </script>
