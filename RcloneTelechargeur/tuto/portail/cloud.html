<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Téléchargez vos fichiers en toute simplicité avec RcloneTelechargeur. Accédez à vos téléchargements via Google Drive ou un lien alternatif.">
    <meta name="keywords" content="Rclone, Téléchargement, Google Drive, TeraBox, Cloud, Fichiers, Backup">
    <meta name="author" content="JokerSmiler">
    <!-- <link rel="canonical" href="https://rclonetelechargeur.netlify.app/tuto/portail/cloud.html"> -->
    <title>Accès à Votre Téléchargement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="/ResourceInfographique/fav/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ============================== */
        /*          1. THÈME & VARS        */
        /* ============================== */
        :root {
            --primary-blue: #007BFF;
            --primary-blue-hover: #0056b3;
            --bg-color: #f4f7f9; /* Un gris très clair, plus doux que le blanc pur */
            --surface-color: #ffffff;
            --text-color-dark: #212529;
            --text-color-muted: #6c757d;
            --font-family: 'Poppins', sans-serif;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        /* ============================== */
        /*          2. STRUCTURE          */
        /* ============================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .download-card {
            background-color: var(--surface-color);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px var(--shadow-color);
            text-align: center;
            width: 90%;
            max-width: 500px;
            animation: fadeInScale 0.6s ease-out;
            border-top: 5px solid var(--primary-blue);
        }
        
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ============================== */
        /*           3. CONTENU           */
        /* ============================== */
        .cloud-icon {
            font-size: 6rem;
            color: var(--primary-blue);
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 4px 10px rgba(0, 123, 255, 0.3));
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-color-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 1rem;
            font-weight: 600;
            font-size: 1.1rem;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        /* Style du bouton principal */
        .btn-primary {
            background-color: var(--primary-blue);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--primary-blue-hover);
        }
        
        /* Style du bouton secondaire (le backup) */
        .btn-secondary {
            background-color: transparent;
            color: var(--primary-blue);
            border: 2px solid var(--primary-blue);
        }
        .btn-secondary:hover {
            background-color: var(--primary-blue);
            color: white;
        }

        /* ============================== */
        /*           4. FOOTER            */
        /* ============================== */
        footer {
            position: absolute;
            bottom: 1rem;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-color-muted);
        }

    </style>
</head>
<body>

    <main class="download-card">
        
        <div class="cloud-icon">
            <i class="fas fa-cloud-download-alt"></i>
        </div>

        <h1>Votre Fichier est Prêt</h1>
        <p>
            Cliquez sur l'un des liens ci-dessous pour démarrer le téléchargement. Si le premier lien ne fonctionne pas, veuillez utiliser le lien alternatif.
        </p>

        <div class="button-container">

            <!-- ===================================== -->
            <!--   MODIFIEZ VOS LIENS DE TÉLÉCHARGEMENT ICI  -->
            <!-- ===================================== -->
            
            <!-- LIEN PRINCIPAL -->
            <a href="https://drive.google.com/file/d/1x94tg1yDEuBolHe2dSaGzw4ExJrb720M/view?usp=sharing" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-google-drive"></i> Télécharger via Google Drive
            </a>

            <!-- LIEN ALTERNATIF (BACKUP) -->
            <a href="#" onclick="event.preventDefault(); alert('Lien indisponible.\nVeuillez cliquer sur le premier lien.')" class="btn btn-secondary" rel="noopener noreferrer">
                <i class="fas fa-database"></i> Lien Alternatif (TeraBox, etc.)
            </a>
            
        </div>

    </main>
    
  

</body>
</html>
