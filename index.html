<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Gateway :: Redirection</title>
    <meta name="description" content="Page de redirection sécurisée pour accéder à des ressources externes. Cliquez pour initier le transfert.">
    <meta name="keywords" content="redirection, système, sécurité, transfert, ressources externes">
    <meta name="author" content="Joker Redirection">
    <link rel="shortcut icon" href="./DorkingOnline/fav/favicon.ico" type="image/x-icon">
    <meta property="og:image" content="https://ibb.co/S4vzscsg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ============================== */
        /*          1. THÈME & VARS        */
        /* ============================== */
        :root {
            --bg-dark: #0a0a12;
            --primary: #1a1a2e;
            --accent: #00ff88;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --border: #2a2a3a;
            --glow: 0 0 20px rgba(0, 255, 136, 0.3), 0 0 5px rgba(0, 255, 136, 0.5);
            --font-main: 'JetBrains Mono', monospace;
            --font-display: 'Share Tech Mono', monospace;
        }

        /* ============================== */
        /*          2. STRUCTURE          */
        /* ============================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .terminal-container {
            width: 90%;
            max-width: 700px;
            background-color: rgba(10, 10, 18, 0.8);
            border: 1px solid var(--border);
            padding: 3rem;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            animation: fadeIn 1s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================== */
        /*           3. CONTENU           */
        /* ============================== */
        h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 1rem;
            text-shadow: var(--glow);
        }
        
        .blink {
            animation: blink-caret 1s step-end infinite;
        }
        
        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: var(--accent); }
        }
        
        p {
            color: var(--text-dim);
            margin-bottom: 3rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.7;
        }
        
        #redirect-btn {
            font-family: var(--font-main);
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
            background: transparent;
            border: 2px solid var(--accent);
            padding: 1.2rem 3rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            box-shadow: inset 0 0 10px rgba(0, 255, 136, 0.2);
        }

        #redirect-btn:hover {
            background: var(--accent);
            color: var(--bg-dark);
            box-shadow: var(--glow);
            transform: translateY(-5px);
        }
        
        #redirect-btn:active {
            transform: translateY(0);
        }

        /* ============================== */
        /*         4. RESPONSIVE          */
        /* ============================== */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }
            p {
                font-size: 0.9rem;
            }
            #redirect-btn {
                font-size: 1rem;
                padding: 1rem 2rem;
            }
            .terminal-container {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>

    <main class="terminal-container">
        <h1>// SYSTEM_GATEWAY<span class="blink">_</span></h1>
        <p>Connexion sécurisée en attente. L'accès à la ressource externe nécessite votre autorisation. Cliquez pour initier le transfert.</p>
        
        <!-- LE BOUTON DE REDIRECTION -->
        <button id="redirect-btn">
            <i class="fas fa-arrow-right"></i>
            REDIRECTION
        </button>
    </main>
    
    <script>
        // ======================================
        //          JAVASCRIPT
        // ======================================
        document.addEventListener('DOMContentLoaded', () => {

            // 1. Définir l'URL de destination ici
            const targetUrl = './TousMesSites/index.html';
            
            // 2. Récupérer le bouton par son ID
            const redirectButton = document.getElementById('redirect-btn');
            
            // 3. Ajouter un écouteur d'événement au clic
            redirectButton.addEventListener('click', () => {
                // Mettre à jour le texte du bouton pour un feedback visuel
                redirectButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> TRANSFERT EN COURS...';
                
                // Rediriger l'utilisateur après un court délai pour l'animation
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 700); // Délai de 0.7 seconde
            });
            
        });
    </script>
</body>
</html>
